<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagina non trovata · Marco Bomben</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ff2e88">
<style>
@font-face{font-family:'Bricolage Grotesque';font-weight:200 800;font-stretch:75% 100%;font-display:swap;src:url(/marco-bomben/fonts/bricolage-latin.woff2) format('woff2')}
:root{--pink:#ff2e88;--ink:#0a0a0a;--dark:#0b0b0b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--dark);color:#fff;font:400 1.125rem/1.55 "Bricolage Grotesque","Arial Narrow",system-ui,sans-serif}
main{min-height:100%;display:grid;place-content:center;gap:24px;padding:24px;text-align:center}
h1{margin:0;font-weight:800;font-size:clamp(5rem,22vw,14rem);line-height:.85;font-variation-settings:"opsz" 96,"wdth" 75;letter-spacing:-.03em;color:var(--pink);position:relative}
/* una colatura sotto il numero, come nel titolo del sito */
h1::after{content:"";position:absolute;left:58%;top:92%;width:.09em;height:.55em;border-radius:0 0 999px 999px;background:var(--pink)}
p{margin:0;color:#a3a29d;max-width:32ch;justify-self:center}
a{justify-self:center;display:inline-block;background:var(--pink);color:var(--ink);font-weight:800;text-decoration:none;border:3px solid var(--ink);border-radius:999px;padding:12px 22px;box-shadow:4px 4px 0 #fff}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>404</h1>
<p>Questa pagina è colata via. Le tele invece sono tutte al loro posto.</p>
<a href="/marco-bomben/">Torna alle opere</a>
</main>
</body>
</html>
